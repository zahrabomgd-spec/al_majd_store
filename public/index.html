<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بقالة المجد</title>
    <style>
        body { font-family: sans-serif; background: #f8f9fa; margin: 0; padding: 15px; text-align: center; }
        h1 { color: #2c3e50; margin-bottom: 5px; }
        .container { max-width: 900px; margin: auto; }
        
        /* أزرار التصنيفات */
        .categories-bar { display: flex; justify-content: center; gap: 8px; margin: 15px 0; flex-wrap: wrap; }
        .cat-btn { background: #e2e8f0; border: none; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-weight: bold; color: #4a5568; transition: 0.2s; }
        .cat-btn.active, .cat-btn:hover { background: #3182ce; color: white; }

        /* الشبكة المرتبة */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; justify-content: center; margin-top: 15px; }
        .card { background: white; border-radius: 10px; padding: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-align: right; display: flex; flex-direction: column; justify-content: space-between; }
        .card img { width: 100%; height: 140px; object-fit: cover; border-radius: 6px; }
        .card h3 { font-size: 1rem; margin: 8px 0 4px 0; color: #2d3748; }
        .category-tag { font-size: 0.75rem; background: #edf2f7; color: #4a5568; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-bottom: 5px; width: fit-content; }
        .price { color: #2f855a; font-weight: bold; font-size: 1.05rem; margin-bottom: 8px; }
        
        .btn-wa { display: block; background: #25D366; color: white; text-decoration: none; text-align: center; padding: 7px; border-radius: 6px; font-weight: bold; font-size: 0.9rem; margin-bottom: 5px; }
        .action-row { display: flex; gap: 5px; margin-top: 5px; }
        .btn-edit { background: #d69e2e; color: white; border: none; padding: 5px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; flex: 1; }
        .btn-del { background: #e53e3e; color: white; border: none; padding: 5px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; flex: 1; }

        /* نموذج التعديل المخفي داخل البطاقة */
        .edit-form { display: none; background: #fffaf0; padding: 10px; margin-top: 10px; border-radius: 6px; border: 1px solid #feebc8; font-size: 0.85rem; }
        .edit-form input, .edit-form select { width: 100%; padding: 5px; margin-bottom: 5px; border-radius: 4px; border: 1px solid #cbd5e0; box-sizing: border-box; }
        .btn-save { background: #38a169; color: white; border: none; width: 100%; padding: 6px; border-radius: 4px; cursor: pointer; font-weight: bold; }

        /* لوحة التحكم */
        .admin-section { background: white; padding: 15px; border-radius: 10px; margin-top: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-align: right; }
        .admin-section h3 { margin-top: 0; color: #2c3e50; text-align: center; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 0.85rem; margin-bottom: 3px; color: #4a5568; }
        input, select, button { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e0; box-sizing: border-box; }
        .btn-submit { background: #3182ce; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛒 بقالة المجد</h1>
        <p style="color: #718096; font-size: 0.9rem; margin-top:0;">تسوق أطيب المنتجات بكل سهولة</p>

        <!-- شريط التصنيفات -->
        <div class="categories-bar" id="categories-bar">
            <button class="cat-btn active" onclick="filterCategory('الكل', this)">الكل</button>
        </div>

        <!-- شبكة المنتجات -->
        <div class="grid" id="products-list"></div>

        <!-- لوحة التحكم لإضافة منتج جديد -->
        <div class="admin-section">
            <h3>إضافة منتج جديد</h3>
            <form action="/add" method="POST" enctype="multipart/form-data">
                <div class="form-group">
                    <label>اسم المنتج</label>
                    <input type="text" name="name" required placeholder="مثال: سكر، شاي...">
                </div>
                <div class="form-group">
                    <label>الصنف / القسم</label>
                    <select name="category" required>
                        <option value="مواد غذائية">مواد غذائية</option>
                        <option value="مشروبات">مشروبات</option>
                        <option value="منظفات">منظفات</option>
                        <option value="خضار وفواكه">خضار وفواكه</option>
                        <option value="أخرى">أخرى</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>السعر</label>
                    <input type="text" name="price" required placeholder="مثال: 15000 ل.س">
                </div>
                <div class="form-group">
                    <label>صورة المنتج</label>
                    <input type="file" name="image" accept="image/*" required>
                </div>
                <button type="submit" class="btn-submit">إضافة للمتجر</button>
            </form>
        </div>
    </div>

    <script>
        const phone = "963992480155";
        let allProducts = [];

        async function loadProducts() {
            const res = await fetch('/products');
            allProducts = await res.json();
            
            const categories = ['الكل', ...new Set(allProducts.map(p => p.category || 'أخرى'))];
            const bar = document.getElementById('categories-bar');
            bar.innerHTML = '';
            categories.forEach(cat => {
                bar.innerHTML += `<button class="cat-btn ${cat === 'الكل' ? 'active' : ''}" onclick="filterCategory('${cat}', this)">${cat}</button>`;
            });

            renderGrid(allProducts);
        }

        function renderGrid(products) {
            const list = document.getElementById('products-list');
            list.innerHTML = '';

            if (products.length === 0) {
                list.innerHTML = '<p style="grid-column: 1/-1; color: #a0aec0;">لا توجد منتجات مضافة بعد.</p>';
                return;
            }

            products.forEach(p => {
                const msg = encodeURIComponent(`مرحباً بقالة المجد، أريد طلب:\n- المنتج: ${p.name}\n- السعر: ${p.price}`);
                const waLink = `https://wa.me/${phone}?text=${msg}`;

                list.innerHTML += `
                    <div class="card">
                        <div>
                            <span class="category-tag">${p.category || 'أخرى'}</span>
                            <img src="${p.image || 'https://via.placeholder.com/150'}" alt="${p.name}">
                            <h3>${p.name}</h3>
                            <div class="price">${p.price}</div>
                        </div>
                        <div>
                            <a href="${waLink}" target="_blank" class="btn-wa">طلب واتساب</a>
                            <div class="action-row">
                                <button class="btn-edit" onclick="toggleEdit('${p.id}')">تعديل</button>
                                <form action="/delete/${p.id}" method="POST" style="margin:0; flex:1;">
                                    <button class="btn-del" onclick="return confirm('حذف المنتج؟')" style="width:100%;">حذف</button>
                                </form>
                            </div>

                            <!-- فورم التعديل يفتح عند الضغط على زر تعديل -->
                            <div id="edit-form-${p.id}" class="edit-form">
                                <form action="/update/${p.id}" method="POST" enctype="multipart/form-data">
                                    <input type="text" name="name" value="${p.name}" required placeholder="الاسم">
                                    <select name="category">
                                        <option value="مواد غذائية" ${p.category==='مواد غذائية'?'selected':''}>مواد غذائية</option>
                                        <option value="مشروبات" ${p.category==='مشروبات'?'selected':''}>مشروبات</option>
                                        <option value="منظفات" ${p.category==='منظفات'?'selected':''}>منظفات</option>
                                        <option value="خضار وفواكه" ${p.category==='خضار وفواكه'?'selected':''}>خضار وفواكه</option>
                                        <option value="أخرى" ${p.category==='أخرى'?'selected':''}>أخرى</option>
                                    </select>
                                    <input type="text" name="price" value="${p.price}" required placeholder="السعر">
                                    <input type="file" name="image" accept="image/*">
                                    <button type="submit" class="btn-save">حفظ التعديل</button>
                                </form>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function toggleEdit(id) {
            const form = document.getElementById(`edit-form-${id}`);
            form.style.display = form.style.display === 'block' ? 'none' : 'block';
        }

        function filterCategory(cat, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if (cat === 'الكل') {
                renderGrid(allProducts);
            } else {
                const filtered = allProducts.filter(p => (p.category || 'أخرى') === cat);
                renderGrid(filtered);
            }
        }

        loadProducts();
    </script>
</body>
</html>
