<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بقالة المجد</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; margin: 0; padding: 15px; text-align: center; }
        h1 { color: #2c3e50; }
        .container { max-width: 800px; margin: auto; }
        .grid { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; }
        .card { background: white; border-radius: 8px; padding: 15px; width: 200px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 150px; object-fit: cover; border-radius: 5px; }
        .price { color: #27ae60; font-weight: bold; font-size: 1.1em; }
        .btn-wa { display: inline-block; background: #25D366; color: white; text-decoration: none; padding: 8px 12px; border-radius: 5px; margin-top: 5px; font-weight: bold; }
        .admin-section { background: #eef2f5; padding: 15px; border-radius: 8px; margin-bottom: 20px; margin-top: 30px; }
        input, button { margin: 5px; padding: 8px; border-radius: 4px; border: 1px solid #ccc; }
        .btn-edit { background: #f39c12; color: white; border: none; cursor: pointer; }
        .btn-delete { background: #e74c3c; color: white; border: none; cursor: pointer; }
        .edit-form { display: none; background: #fff8e7; padding: 10px; margin-top: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛒 بقالة المجد</h1>

        <!-- عرض المنتجات -->
        <div class="grid" id="products-list"></div>

        <!-- لوحة التحكم الإدارية -->
        <div class="admin-section">
            <h3>لوحة التحكم (إضافة منتج جديد)</h3>
            <form action="/add" method="POST" enctype="multipart/form-data">
                <input type="text" name="name" placeholder="اسم المنتج" required>
                <input type="text" name="price" placeholder="السعر" required>
                <input type="file" name="image" accept="image/*" required>
                <button type="submit" style="background:#2980b9; color:white;">إضافة للمتجر</button>
            </form>
        </div>
    </div>

    <script>
        const phone = "963992480155";

        async function loadProducts() {
            const res = await fetch('/products');
            const products = await res.json();
            const list = document.getElementById('products-list');
            list.innerHTML = '';

            products.forEach(p => {
                const waMessage = encodeURIComponent(`مرحباً بقالة المجد، أرغب في طلب:\n- المنتج: ${p.name}\n- السعر: ${p.price}`);
                const waLink = `https://wa.me/${phone}?text=${waMessage}`;

                list.innerHTML += `
                    <div class="card">
                        <img src="${p.image || 'https://via.placeholder.com/150'}" alt="${p.name}">
                        <h3>${p.name}</h3>
                        <p class="price">${p.price}</p>
                        <a href="${waLink}" target="_blank" class="btn-wa">📲 طلب عبر الواتساب</a>
                        
                        <div style="margin-top: 10px; border-top: 1px solid #eee; padding-top: 5px;">
                            <button class="btn-edit" onclick="toggleEdit('${p.id}')">تعديل</button>
                            <form action="/delete/${p.id}" method="POST" style="display:inline;">
                                <button class="btn-delete" onclick="return confirm('هل أنت متأكد من الحذف؟')">حذف</button>
                            </form>
                        </div>

                        <!-- نموذج التعديل المخفي -->
                        <div id="edit-${p.id}" class="edit-form">
                            <form action="/update/${p.id}" method="POST" enctype="multipart/form-data">
                                <input type="text" name="name" value="${p.name}" placeholder="الاسم الجديد"><br>
                                <input type="text" name="price" value="${p.price}" placeholder="السعر الجديد"><br>
                                <input type="file" name="image" accept="image/*"><br>
                                <button type="submit" style="background:#27ae60; color:white;">حفظ التعديل</button>
                            </form>
                        </div>
                    </div>
                `;
            });
        }

        function toggleEdit(id) {
            const form = document.getElementById(`edit-${id}`);
            form.style.display = form.style.display === 'block' ? 'none' : 'block';
        }

        loadProducts();
    </script>
</body>
</html>
