<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بقالة المجد الفاخرة</title>
    <link rel="stylesheet" href="manifest.json">
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f6f5; margin: 0; padding: 0; direction: rtl; }
        header { background-color: #0b4f34; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .container { padding: 20px; max-width: 800px; margin: auto; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .product-card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .product-card h3 { font-size: 16px; margin: 10px 0; color: #333; }
        .product-card p { color: #0b4f34; font-weight: bold; margin: 10px 0; }
        .btn { background-color: #0b4f34; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; width: 100%; }
        .btn:active { background-color: #083724; }
    </style>
</head>
<body>

    <header>
        <h2>بقالة المجد الفاخرة</h2>
        <span id="cart-count" style="background: #198754; padding: 5px 10px; border-radius: 5px;">🛒 0</span>
    </header>

    <div class="container">
        <h2>المنتجات المتوفرة</h2>
        <div id="products-list" class="products-grid">
            <!-- المنتجات ستظهر هنا تلقائياً -->
        </div>
    </div>

    <script>
        // المنتجات الأساسية الافتراضية
        const defaultProducts = [
            {id: 1, name: "سكر أبيض ممتاز (1كغ)", price: 45000, category: "مواد جافة"},
            {id: 2, name: "سمنة بلدي فاخرة", price: 120000, category: "زيوت وألبان"},
            {id: 3, name: "زيت زیتون بكر ممتاز", price: 85000, category: "زيوت وألبان"},
            {id: 4, name: "عدس حب طازج (1كغ)", price: 50000, category: "حبوب وبقوليات"}
        ];

        // حفظ المنتجات في التخزين المحلي إذا لم تكن موجودة
        if (!localStorage.getItem("al_majd_products")) {
            localStorage.setItem("al_majd_products", JSON.stringify(defaultProducts));
        }

        // عرض المنتجات على الشاشة
        function renderProducts() {
            const products = JSON.parse(localStorage.getItem("al_majd_products")) || [];
            const container = document.getElementById("products-list");
            container.innerHTML = "";

            products.forEach(p => {
                container.innerHTML += `
                    <div class="product-card">
                        <h3>${p.name}</h3>
                        <p>${p.price} ل.س</p>
                        <button class="btn" onclick="alert('تمت إضافة ${p.name} إلى السلة')">إضافة للسلة</button>
                    </div>
                `;
            });
        }

        renderProducts();
    </script>
</body>
</html>
